services:
  db:
    image: postgres:16-alpine
    container_name: meetly-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetly_password}
      POSTGRES_DB: ${POSTGRES_DB:-meetly_db}
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meetly-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetly} -d ${POSTGRES_DB:-meetly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meetly-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - meetly-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: meetly-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://redis:6379/0}
    networks:
      - meetly-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # API router (/api/...)
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=20"
      - "traefik.http.routers.api.service=api"
      # API docs router (/docs, /redoc, /openapi.json)
      - "traefik.http.routers.api-docs.rule=PathPrefix(`/docs`) || PathPrefix(`/redoc`) || Path(`/openapi.json`)"
      - "traefik.http.routers.api-docs.entrypoints=web"
      - "traefik.http.routers.api-docs.priority=20"
      - "traefik.http.routers.api-docs.service=api"
      # Service definition & healthcheck
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.api.loadbalancer.healthcheck.timeout=2s"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: meetly-worker
    restart: always
    env_file:
      - ./.env
    environment:
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://redis:6379/0}
    networks:
      - meetly-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: meetly-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    networks:
      - meetly-net
    labels:
      - "traefik.enable=true"
      # Web router (matches all other routes)
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.service=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: meetly-ai-service
    restart: always
    ports:
      - "8005:8005"
    environment:
      - SEAMLESS_MODEL_ID=JustFrederik/nllb-200-distilled-600M-ct2-float16
      - SEAMLESS_DEVICE=cuda
      - SEAMLESS_DTYPE=float16
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - /mnt/data/dutai/hf_cache:/root/.cache/huggingface
    networks:
      - meetly-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  traefik:
    image: traefik:latest
    container_name: meetly-traefik
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
    ports:
      - "9876:80"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - meetly-net
    depends_on:
      - api
      - web

networks:
  meetly-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
