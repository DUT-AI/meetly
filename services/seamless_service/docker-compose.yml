services:
  seamless-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetly-seamless-service
    restart: always
    ports:
      - "8005:8005"
    environment:
      - SEAMLESS_MODEL_ID=facebook/seamless-m4t-v2-large
      - SEAMLESS_DEVICE=cuda
      - SEAMLESS_DTYPE=float16
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - /mnt/data/dutai/hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
