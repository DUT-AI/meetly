[project]
name = "meetly"
version = "0.1.0"
description = "Meetly - Modular Monolith Issue Tracking Platform"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    # Core API & Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
    "dishka>=1.4.0",
    "python-multipart>=0.0.9",
    # Database & Storage
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "boto3>=1.35.0",
    # Auth & Security
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    # Observability & Utilities
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "python-ulid>=3.0.0",
]

[project.optional-dependencies]
worker = [
    "arq>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "modules", "apps"]

[tool.ruff]
target-version = "py312"
exclude = [".venv", ".git", "web"]

[tool.ruff.lint]
ignore = ["B008", "BLE001", "UP046", "S110", "FURB162"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
exclude = [".venv", "web"]
