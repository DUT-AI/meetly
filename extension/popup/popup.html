<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetly Audio Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <img src="../icons/icon48.png" width="24" height="24" style="border-radius: 6px; object-fit: cover;" alt="Meetly">
        </div>
        <div class="brand-text">
          <h1>Meetly</h1>
          <span class="subtext">Google Meet Recorder</span>
        </div>
      </div>
      <span class="version-badge">v1.0</span>
    </header>

    <!-- Meeting status card -->
    <div class="meeting-status-card" id="meetingCard">
      <div class="status-header">
        <span class="status-label" id="statusLabel">Chưa phát hiện Meet</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="meeting-code" id="meetingCode">Hãy mở một tab Google Meet</div>
      <div class="timer" id="timerDisplay">00:00</div>
    </div>

    <!-- Quick controls -->
    <div class="controls-section">
      <button class="btn btn-record" id="btnStart">
        <span class="btn-icon">🔴</span> Bắt đầu ghi âm
      </button>

      <div class="btn-group-active" id="activeGroup" style="display: none;">
        <button class="btn btn-pause" id="btnPause">Tạm dừng</button>
        <button class="btn btn-stop" id="btnStop">⏹ Dừng & Lưu file</button>
      </div>
    </div>

    <!-- Settings accordion/card -->
    <div class="settings-card">
      <div class="settings-title">Cài đặt ghi âm</div>
      
      <label class="setting-item">
        <span>Ghi âm Micro (giọng của bạn)</span>
        <input type="checkbox" id="chkRecordMic" checked>
      </label>

      <label class="setting-item">
        <span>Tự động tải file .webm về máy</span>
        <input type="checkbox" id="chkAutoDownload" checked>
      </label>

      <div class="server-config">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label for="txtServerUrl" style="margin-bottom: 0;">Máy chủ Meetly (API):</label>
          <div style="display: flex; gap: 4px;">
            <button type="button" id="btnPresetLocal" style="font-size: 10px; padding: 2px 6px; background: #334155; border: 1px solid #475569; border-radius: 4px; color: #cbd5e1; cursor: pointer;">Local (8000)</button>
            <button type="button" id="btnPresetProd" style="font-size: 10px; padding: 2px 6px; background: #334155; border: 1px solid #475569; border-radius: 4px; color: #cbd5e1; cursor: pointer;">Production</button>
          </div>
        </div>
        <input type="text" id="txtServerUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
      </div>

      <div class="server-config" style="margin-top: 8px;">
        <label for="txtWorkspaceId">Workspace ID:</label>
        <input type="text" id="txtWorkspaceId" placeholder="ULID của Workspace">
      </div>

      <div class="server-config" style="margin-top: 8px;">
        <label for="txtMeetingId">Meeting ID:</label>
        <input type="text" id="txtMeetingId" placeholder="ULID của Meeting">
      </div>

      <div class="server-config" style="margin-top: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label for="txtAuthToken" style="margin-bottom: 0;">Auth Token (Bearer):</label>
          <span id="authStatusBadge" style="font-size: 10px; font-weight: 600; color: #10b981;">Đang kiểm tra...</span>
        </div>
        <input type="password" id="txtAuthToken" placeholder="Tự động lấy từ Cookie hoặc dán Bearer token">
      </div>
    </div>

    <!-- Footer links -->
    <footer class="footer">
      <a href="https://meet.google.com" target="_blank" class="footer-link">Mở Google Meet</a>
      <span class="sep">•</span>
      <a href="https://meetly.dutai.io.vn/" target="_blank" class="footer-link">Vào Meetly Web</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
