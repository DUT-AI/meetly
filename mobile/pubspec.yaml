name: meetly_mobile
description: Meetly - Team Workspace, Tasks and Meeting Audio Intelligence App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Routing
  go_router: ^14.1.4

  # Audio & Media
  just_audio: ^0.9.38
  audio_video_progress_bar: ^2.0.3

  # UI Utilities
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
