services:
  db:
    image: postgres:16-alpine
    container_name: meetly-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetly_password}
      POSTGRES_DB: ${POSTGRES_DB:-meetly_db}
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meetly-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetly} -d ${POSTGRES_DB:-meetly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meetly-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meetly-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: meetly-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    networks:
      - meetly-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: meetly-worker
    restart: always
    env_file:
      - ./.env
    networks:
      - meetly-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: meetly-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    networks:
      - meetly-net

  nginx:
    image: nginx:alpine
    container_name: meetly-nginx
    restart: always
    ports:
      - "9876:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - meetly-net

networks:
  meetly-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
